name: Docs Bot

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      target_path:
        description: "Caminho específico para documentar (opcional, ex: src/views/components)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  update-docs:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate documentation with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: "openai/gpt-4o-mini"
          TARGET_PATH: ${{ inputs.target_path || '' }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/generate-docs.mjs

      - name: Create Pull Request with updated docs
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: atualiza documentação automaticamente"
          title: "docs: atualização automática da documentação"
          body: |
            Este Pull Request foi gerado automaticamente pelo **Docs Bot** com base nas alterações recentes do repositório.

            Revise os arquivos em `docs/` antes de fazer o merge.
          branch: docs/auto-update
          delete-branch: true
          add-paths: |
            docs/

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prepare environment config
        run: cp config/prod.env.js.EXAMPLE config/prod.env.js

      - name: Check formatting on changed files (Prettier)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs npx prettier --ignore-unknown --check
          fi

      - name: Run static analysis on changed files (ESLint)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_CODE=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD -- '*.js' '*.mjs' '*.cjs' '*.vue')
          if [ -n "$CHANGED_CODE" ]; then
            echo "$CHANGED_CODE" | xargs npx eslint
          fi

      - name: Build production bundle
        run: npm run build

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prepare environment config
        run: cp config/prod.env.js.EXAMPLE config/prod.env.js

      - name: Check formatting on changed files (Prettier)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs npx prettier --ignore-unknown --check
          fi

      - name: Run static analysis (ESLint)
        run: npx eslint .

      - name: Build production bundle
        run: npm run build
